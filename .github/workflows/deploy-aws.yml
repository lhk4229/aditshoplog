name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check AWS secrets
        id: guard
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          if [ -z "$AWS_HOST" ] || [ -z "$AWS_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS secrets not configured — deploy skipped"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.guard.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER != '' && secrets.AWS_USER || 'ubuntu' }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          debug: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.AWS_APP_DIR }}"
            APP_DIR="${APP_DIR:-$HOME/aditshoplog}"

            echo "==> Deploy target: $APP_DIR"

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR not found."
              echo "On the server, run:"
              echo "  git clone git@github.com:lhk4229/aditshoplog.git ~/aditshoplog"
              echo "  cd ~/aditshoplog && ./deploy/setup-server.sh"
              exit 1
            fi

            cd "$APP_DIR"

            if [ ! -f ".env" ]; then
              echo "ERROR: $APP_DIR/.env not found."
              echo "On the server, run:"
              echo "  cp deploy/.env.production.example .env && nano .env"
              exit 1
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: docker not installed. Run ./deploy/setup-server.sh on the server."
              exit 1
            fi

            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: docker permission denied. Run: sudo usermod -aG docker $USER && re-login"
              exit 1
            fi

            origin_url="$(git remote get-url origin)"
            if [[ "$origin_url" == https://github.com/* ]]; then
              repo_path="${origin_url#https://github.com/}"
              repo_path="${repo_path%.git}"
              echo "==> Converting HTTPS remote to SSH"
              git remote set-url origin "git@github.com:${repo_path}.git"
            fi

            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            echo "==> Pull latest code"
            if ! git fetch origin main; then
              echo "ERROR: git fetch failed. Add server SSH key to GitHub Deploy keys:"
              echo "  cat ~/.ssh/id_ed25519.pub"
              exit 1
            fi
            git reset --hard origin/main

            echo "==> Build and start containers"
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build 2>&1

            echo "==> Prune unused images"
            docker image prune -f 2>&1

            echo "==> Deploy complete"
            docker compose -f docker-compose.prod.yml ps 2>&1
