services:
  postgres:
    image: postgres:16-alpine
    container_name: aditshoplog-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aditshoplog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aditshoplog}
      POSTGRES_DB: ${POSTGRES_DB:-aditshoplog}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aditshoplog} -d ${POSTGRES_DB:-aditshoplog}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: aditshoplog-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    volumes:
      - ./docker/adminer/default-pgsql.php:/var/www/html/plugins-enabled/default-pgsql.php:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: